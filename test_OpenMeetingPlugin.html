<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSBridge Test</title>
<style>
body { font: 12px monospace; background: #1a1a2e; color: #e0e0e0; padding: 8px; margin: 0; }
h2 { color: #00d4ff; margin: 4px 0; font-size: 14px; }
#info { color: #888; font-size: 11px; margin-bottom: 6px; }
.row { display: flex; padding: 2px 0; border-bottom: 1px solid #2a2a4a; align-items: baseline; }
.m { flex: 0 0 42%; color: #ffd700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s { flex: 0 0 12%; text-align: center; font-weight: bold; font-size: 11px; }
.ok { color: #00ff88; }
.fail { color: #ff4444; }
.timeout { color: #ff8800; }
.wait { color: #555; }
.d { flex: 1; color: #aaa; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sum { margin-top: 8px; padding: 6px; background: #0f3460; border-radius: 4px; font-size: 13px; }
#raw { margin-top: 8px; font-size: 10px; color: #666; word-break: break-all; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>
<h2 id="title">JSBridge Test</h2>
<div id="info"></div>
<div id="log"></div>
<div id="sum"></div>
<div id="raw"></div>

<script>
// ===== 配置 =====
var PLUGINS = {
  CommonPlugin: [
    "OpenNewPage","SetShareInfo","SavePic","OpenOperationUrl",
    "GetNetWorkInfo","OpenShareBoard","OpenMeetingInfoShareBoard",
    "ShareToThirdApp","IsSupportShareToThirdAppByType","GetShareThirdAppList",
    "LaunchMiniProgram","GetTicket","GetCurrentPageTicket",
    "RegisterEvent","UnRegisterEvent","GetPerformance",
    "GetCurrentMeetingInfo","GetServerTimestampMsec","RouterToExternalBrowser",
    "ShowLoading","HideLoading","GetClipboard","RequestServerData",
    "PrintLog","PreviewImage","ExportFile","AddCalender","SendMail",
    "SetTitle","CloseWhenBack","SetImageToClipboard","LoadUrl",
    "GetWebPageRunningContext","TemplateUpdateSuccess",
    "UpdateTemplatePreloadDataCache","ToggleWindowMaximizeState"
  ],
  DevicePlugin: [
    "GetClientInfo","GetDeviceInfo","SetKeepScreenOn","ChangeOrientation",
    "GetWxOpenId","GetXiaoKaiToken","GetVoIPStatus","GetNativeConfig",
    "GetPhoneNumber","IsAppInstalled","GetAppState","GetAnonymousDeviceId",
    "GetCurrentLanguage","GetWxAccessToken","GetWebViewType"
  ],
  UIPlugin: [
    "SetTitleBar","SetTitleBarLeftBtn","SetTitleBarRightBtn",
    "SetTitleBarLeftBtns","SetTitleBarRightBtns","ShowShareButton",
    "SetPullDownRefresh","StopPullDownRefresh","SetWebViewBackgroundColor",
    "ShowActionSheet","ShowToast","HideToast","ShowModal",
    "StartPullDownRefresh","ShowTabBar","HideTabBar",
    "SetTabBarItem","SetTabBarStyle","SetTabBarBadge",
    "RemoveTabBarBadge","ShowTabBarRedDot","HideTabBarRedDot",
    "SwitchTab","PullDownReachBottom","SetSwipeBack",
    "SetWebViewConfig","ShowLoading","HideLoading"
  ],
  OpenApiPlugin: [
    "JsApiConfig","Authorize","GetOpenAppInfo","GetLoginAuthCode",
    "GetLoginUserInfo","OpenAppLog","OpenAppReport","GetAnonymousCode"
  ],
  MeetingPlugin: [
    "GetRunningMeetingInfo","GetMeetingGuestList","EndMeeting",
    "LeaveMeeting","StartScreenShare","StopScreenShare",
    "GetShareUserScreen","GetMainVideoUser","GetMeetingAllUser","GetCurrentUser"
  ],
  BluetoothPlugin: [
    "OpenBluetoothAdapter","CloseBluetoothAdapter","GetBluetoothAdapterState",
    "StartBluetoothDevicesDiscovery","StopBluetoothDevicesDiscovery",
    "GetBluetoothDevices","GetConnectedBluetoothDevices",
    "CreateBLEConnection","CloseBLEConnection",
    "GetBLEDeviceServices","GetBLEDeviceCharacteristics","ReadBLECharacteristicValue"
  ]
};

// 读取 plugin: 优先 query string ?plugin=X，其次 path 最后一段 /X，默认 CommonPlugin
var plugin = "OpenMeetingPlugin";
var qs = (location.search || "").substring(1);
qs.split("&").forEach(function(p) {
  var kv = p.split("=");
  if (kv[0] === "plugin" && kv[1]) plugin = decodeURIComponent(kv[1]);
});
plugin = "OpenMeetingPlugin"; if (false) {
  // fallback: 从 path 读取，如 /test_jsbridge/DevicePlugin
  var segs = location.pathname.split("/");
  var last = segs[segs.length - 1];
  if (PLUGINS[last]) plugin = last;
  else plugin = "CommonPlugin";
}
var METHODS = PLUGINS[plugin];
var TIMEOUT_MS = 3000;
var results = {};
var pending = METHODS.length;

document.getElementById("title").textContent = "JSBridge: " + plugin + " (" + METHODS.length + ")";

function report(method, status, data) {
  results[method] = {s: status, d: data};
  var el = document.getElementById("r_" + method);
  if (el) {
    el.querySelector(".s").className = "s " + status;
    el.querySelector(".s").textContent = status.toUpperCase();
    var t = "";
    if (data && typeof data === "object") {
      var c = data.code !== undefined ? data.code : (data.errCode !== undefined ? data.errCode : "");
      var m = data.msg || data.errMsg || data.message || "";
      t = "code=" + c + " " + m;
    } else if (data) {
      t = String(data);
    }
    el.querySelector(".d").textContent = t;
  }
  // console.log 方便 logcat 抓取
  console.log("[JSBRIDGE] " + plugin + "." + method + " => " + status + " | " + JSON.stringify(data));

  pending--;
  if (pending <= 0) finish();
}

function finish() {
  var ok = 0, fail = 0, to = 0;
  for (var m in results) {
    if (results[m].s === "ok") ok++;
    else if (results[m].s === "fail") fail++;
    else to++;
  }
  document.getElementById("sum").innerHTML =
    "<b>DONE:</b> <span class='ok'>" + ok + " OK</span> / " +
    "<span class='fail'>" + fail + " FAIL</span> / " +
    "<span class='timeout'>" + to + " TIMEOUT</span>";
  console.log("[JSBRIDGE_SUMMARY] " + plugin + ": ok=" + ok + " fail=" + fail + " timeout=" + to);
  // 输出完整 JSON 到 raw 区域和 console
  var j = JSON.stringify(results);
  document.getElementById("raw").textContent = j;
  console.log("[JSBRIDGE_RAW] " + j);
}

function callMethod(method) {
  return new Promise(function(resolve) {
    var callId = plugin + "_" + method + "_" + Date.now();
    var cbName = "cb_" + callId.replace(/[^a-zA-Z0-9_]/g, "_");
    var settled = false;

    window[cbName] = function(jsonStr) {
      if (settled) return;
      settled = true;
      try {
        var resp = JSON.parse(jsonStr);
        var code = resp.code !== undefined ? resp.code : (resp.errCode !== undefined ? resp.errCode : -999);
        if (code === 0 || code === "0") {
          report(method, "ok", resp);
        } else {
          report(method, "fail", resp);
        }
      } catch(e) {
        report(method, "ok", jsonStr);
      }
      resolve();
    };

    setTimeout(function() {
      if (!settled) {
        settled = true;
        report(method, "timeout", null);
        resolve();
      }
    }, TIMEOUT_MS);

    try {
      window.JSCallJavaMgr.JSCallNative(JSON.stringify({
        callback: cbName,
        module: plugin,
        method: method,
        param: {},
        callId: callId
      }));
    } catch(e) {
      settled = true;
      report(method, "fail", "ERR:" + e.message);
      resolve();
    }
  });
}

(function() {
  var log = document.getElementById("log");
  var info = document.getElementById("info");

  if (!window.JSCallJavaMgr) {
    info.innerHTML = '<span style="color:red;font-size:14px">ERROR: JSCallJavaMgr not found!</span>';
    console.log("[JSBRIDGE] ERROR: JSCallJavaMgr not found");
    return;
  }
  info.textContent = "JSCallJavaMgr available. Testing...";

  for (var i = 0; i < METHODS.length; i++) {
    var row = document.createElement("div");
    row.className = "row";
    row.id = "r_" + METHODS[i];
    row.innerHTML = '<span class="m">' + METHODS[i] + '</span>' +
                    '<span class="s wait">...</span>' +
                    '<span class="d"></span>';
    log.appendChild(row);
  }

  var idx = 0;
  function next() {
    if (idx >= METHODS.length) return;
    callMethod(METHODS[idx]);
    idx++;
    setTimeout(next, 200);
  }
  next();
})();
</script>
</body>
</html>
